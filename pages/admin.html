<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Digital Mandi</title>
    <link rel="stylesheet" href="../css/admin-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="admin-login-container">
        <div class="admin-card">
            <div class="admin-header">
                <div class="logo">
                    <i class="fa-solid fa-seedling"></i>
                    <h2>Digital Mandi</h2>
                </div>
                <h3>Admin Portal</h3>
                <p>Authorized personnel only.</p>
            </div>

            <form class="admin-form" action="#" method="POST">
                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-envelope"></i> Admin Email</label>
                    <input type="email" class="form-input" placeholder="admin@digitalmandi.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-row">
                    <label class="remember-label">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Secure Login <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </form>

            <div class="back-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Return to Public Site</a>
            </div>
        </div>
    </div>

</body>
</html>
